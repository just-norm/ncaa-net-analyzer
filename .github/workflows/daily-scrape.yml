name: NCAA NET Data Scraper

on:
  schedule:
    # Run 4 times per day (every 6 hours) - ET times converted to UTC
    - cron: '0 11 * * *'  # 6:00 AM ET (11:00 UTC)
    - cron: '0 17 * * *'  # 12:00 PM ET (17:00 UTC)
    - cron: '0 23 * * *'  # 6:00 PM ET (23:00 UTC)
    - cron: '0 5 * * *'   # 12:00 AM ET (5:00 UTC next day)

  workflow_dispatch:  # Allow manual triggering for testing

jobs:
  scrape-ncaa-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape team schedules (batch)
        run: |
          echo "🏀 Scraping team schedules..."
          python scrapers/batch_scraper.py --batch-size 30 --delay 10

      - name: Build website
        run: |
          echo "🔨 Building website with latest data..."
          python build.py

      - name: Check for changes
        id: git-check
        run: |
          if [[ -n $(git status --porcelain data/ public/) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "NCAA NET Bot"
          git add data/ public/
          git commit -m "🤖 Auto-update NCAA data and rebuild site - $(date +'%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "✅ Scraping completed!"
          echo "📁 Teams scraped: $(find data/teams -name 'schedule_analysis.csv' | wc -l)"
