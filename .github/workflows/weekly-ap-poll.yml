name: Weekly AP Poll Update

on:
  schedule:
    # Run every Monday at 12:30 PM ET (17:30 UTC)
    - cron: '30 17 * * 1'

  workflow_dispatch:  # Allow manual triggering

jobs:
  scrape-ap-poll:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape AP Poll
        run: |
          echo "📊 Scraping AP Poll rankings..."
          python scrapers/ap_poll_scraper.py

      - name: Scrape NET Rankings
        run: |
          echo "🔢 Scraping NET rankings..."
          python scrapers/net_rankings_scraper.py

      - name: Update all team schedules (picks up new rankings)
        run: |
          echo "🏀 Updating team schedules with new rankings..."
          python scrapers/batch_scraper.py --batch-size 50 --delay 5

      - name: Build website
        run: |
          echo "🔨 Rebuilding website..."
          python build.py

      - name: Check for changes
        id: git-check
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "NCAA AP Poll Bot"
          git add .
          git commit -m "📊 Weekly AP Poll update - $(date +'%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "✅ AP Poll update completed!"
          echo "📁 AP Poll: data/ap_poll/latest.csv"
          echo "📁 NET Rankings: data/net_rankings/latest.csv"
